<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão Modello — SaaS Multi-Salões de Beleza</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-32x32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function() {
        'use strict';

        /* Regra A: já instalado como PWA? → nunca mostrar */
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) return;

        /* Apenas mobile */
        var ua = navigator.userAgent;
        if (!/Mobi|Android|iPhone|iPad|iPod/i.test(ua) && !(navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return;

        var banner = null;
        var deferredPrompt = null;

        function criarBanner() {
          if (banner) return;
          banner = document.createElement('div');
          banner.id = 'pwa-banner';
          Object.assign(banner.style, {
            position:'sticky', top:'0', left:'0', right:'0', zIndex:'999999',
            background:'#000', color:'#fff', padding:'10px 16px',
            fontFamily:'-apple-system,BlinkMacSystemFont,sans-serif', fontSize:'13px',
            display:'none', alignItems:'center', justifyContent:'center', gap:'12px'
          });

          var texto = document.createElement('span');
          Object.assign(texto.style, { textAlign:'center', lineHeight:'1.4' });
          texto.textContent = '📱 Instale o Gestão Modello para acessar mais rápido.';

          var btnInstalar = document.createElement('button');
          Object.assign(btnInstalar.style, {
            background:'#f59e0b', color:'#000', border:'none', padding:'6px 14px',
            borderRadius:'8px', fontSize:'12px', fontWeight:'700', cursor:'pointer',
            whiteSpace:'nowrap'
          });
          btnInstalar.textContent = 'Instalar';
          btnInstalar.onclick = function() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function(r) {
              if (r.outcome === 'accepted') banner.style.display = 'none';
            });
          };

          var btnDepois = document.createElement('button');
          Object.assign(btnDepois.style, {
            background:'transparent', color:'#999', border:'1px solid #333',
            padding:'6px 14px', borderRadius:'8px', fontSize:'12px',
            fontWeight:'600', cursor:'pointer', whiteSpace:'nowrap'
          });
          btnDepois.textContent = 'Depois';
          btnDepois.onclick = function() {
            try { sessionStorage.setItem('pwa_dismissed', '1'); } catch(e) {}
            banner.style.display = 'none';
          };

          banner.appendChild(texto);
          banner.appendChild(btnInstalar);
          banner.appendChild(btnDepois);
          document.body.insertBefore(banner, document.body.firstChild);
        }

        /* Regra B: beforeinstallprompt → exibir banner */
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          deferredPrompt = e;

          try { if (sessionStorage.getItem('pwa_dismissed') === '1') return; } catch(e) {}

          criarBanner();
          banner.style.display = 'flex';
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
